<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Diagnóstico AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .hidden-section { display: none !important; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <div id="admin-login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gray-100">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-gray-900 text-white rounded-lg flex items-center justify-center mx-auto mb-3">
                    <i class="ph ph-shield-check text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Acesso Restrito</h2>
                <p class="text-gray-500 text-sm">Área exclusiva para administradores.</p>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <input type="password" id="admin-password" placeholder="Senha" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-800 outline-none" required>
                <button type="submit" class="w-full bg-gray-900 text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition-colors">Entrar</button>
                <a href="index.html" class="block text-center text-gray-500 text-sm hover:text-gray-700 mt-4">Voltar ao Site Principal</a>
            </form>
        </div>
    </div>

    <div id="admin-dashboard-screen" class="hidden-section min-h-screen bg-gray-100 flex flex-col">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-gray-900 text-white rounded flex items-center justify-center font-bold">A</div>
                <h1 class="text-xl font-bold text-gray-800">Painel Administrativo</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-sm text-gray-500 bg-gray-50 px-3 py-1 rounded-full border border-gray-200">
                    <span id="total-leads-count" class="font-bold text-gray-900">0</span> Leads
                </div>
                <button onclick="logoutAdmin()" class="text-red-600 hover:text-red-700 font-medium text-sm flex items-center gap-1">
                    <i class="ph ph-sign-out"></i> Sair
                </button>
            </div>
        </header>

        <main class="flex-1 p-6 overflow-auto">
            <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-50 text-xs uppercase font-semibold text-gray-500 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-4">Data</th>
                                <th class="px-6 py-4">Login</th>
                                <th class="px-6 py-4">Empresa (Editar)</th>
                                <th class="px-6 py-4">Contato</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="leads-table-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="client-details-modal" class="hidden-section fixed inset-0 z-50 flex items-center justify-center modal-overlay backdrop-blur-sm p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl h-[90vh] flex flex-col overflow-hidden animate-fade-in">
            <div class="bg-gray-900 px-6 py-4 flex justify-between items-center shrink-0">
                <h3 class="text-white font-bold flex items-center gap-2 text-lg"><i class="ph ph-user-gear"></i> Gerenciar Cliente</h3>
                <button onclick="closeClientDetailsModal()" class="text-gray-400 hover:text-white transition-colors"><i class="ph ph-x text-2xl"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 bg-gray-50">
                <form id="edit-client-form" onsubmit="saveClientDetails(event)">
                    <input type="hidden" id="edit-lead-id">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <h4 class="text-sm font-bold text-gray-900 uppercase tracking-wider border-b pb-2">Dados Cadastrais</h4>
                            <div class="grid gap-4">
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Empresa</label><input type="text" id="edit-business-name" class="w-full p-2 border rounded"></div>
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Nicho</label><input type="text" id="edit-niche" class="w-full p-2 border rounded"></div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div><label class="block text-xs font-semibold text-gray-500 mb-1">Telefone</label><input type="text" id="edit-phone" class="w-full p-2 border rounded"></div>
                                    <div><label class="block text-xs font-semibold text-gray-500 mb-1">Instagram</label><input type="text" id="edit-instagram" class="w-full p-2 border rounded"></div>
                                </div>
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Tipo</label><input type="text" id="edit-type" class="w-full p-2 border rounded"></div>
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Budget</label><input type="text" id="edit-budget" class="w-full p-2 border rounded"></div>
                            </div>
                            
                            <h4 class="text-sm font-bold text-gray-900 uppercase tracking-wider border-b pb-2 pt-4">Acesso</h4>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Login</label><input type="text" id="edit-username" class="w-full p-2 border rounded"></div>
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Senha</label><input type="text" id="edit-password" class="w-full p-2 border rounded"></div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <h4 class="text-sm font-bold text-gray-900 uppercase tracking-wider border-b pb-2">Entregas e Arquivos</h4>
                            <div id="edit-deliverables-container" class="space-y-6"></div>

                            <h4 class="text-sm font-bold text-gray-900 uppercase tracking-wider border-b pb-2 pt-6">Plano de Ação</h4>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 mb-1">Páginas de Vendas</label>
                                    <input type="text" id="plan-pages" placeholder="Colocar as páginas no ar..." class="w-full p-2 border rounded">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 mb-1">Tráfego Pago</label>
                                    <input type="text" id="plan-ads" placeholder="Investir nos anúncios..." class="w-full p-2 border rounded">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 mb-1">Orgânico & Feed</label>
                                    <input type="text" id="plan-content" placeholder="Publicar conteúdos..." class="w-full p-2 border rounded">
                                </div>
                            </div>

                            <h4 class="text-sm font-bold text-gray-900 uppercase tracking-wider border-b pb-2 pt-6">Objetivos</h4>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Objetivo 1</label><input type="text" id="obj-1" placeholder="Mais contatos" class="w-full p-2 border rounded"></div>
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Objetivo 2</label><input type="text" id="obj-2" placeholder="Mais fechamentos" class="w-full p-2 border rounded"></div>
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Objetivo 3</label><input type="text" id="obj-3" placeholder="Mais ofertas" class="w-full p-2 border rounded"></div>
                                <div><label class="block text-xs font-semibold text-gray-500 mb-1">Objetivo 4</label><input type="text" id="obj-4" placeholder="Mais lucro" class="w-full p-2 border rounded"></div>
                            </div>

                            <h4 class="text-sm font-bold text-gray-900 uppercase tracking-wider border-b pb-2 pt-6">Métricas Importantes (Diário)</h4>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 mb-1">Novos Clientes (WhatsApp)</label>
                                    <input type="text" id="met-whatsapp" class="w-full p-2 border rounded">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 mb-1">Fechamentos / Vendas</label>
                                    <input type="text" id="met-sales" class="w-full p-2 border rounded">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 mb-1">Valor Bruto Vendas</label>
                                    <input type="text" id="met-gross" class="w-full p-2 border rounded">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 mb-1">Total Lucro Líquido</label>
                                    <input type="text" id="met-profit" class="w-full p-2 border rounded">
                                </div>
                            </div>

                        </div>
                    </div>
                </form>
            </div>
            <div class="bg-white border-t p-4 flex justify-end gap-3 shrink-0">
                <button onclick="closeClientDetailsModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm font-medium">Cancelar</button>
                <button onclick="document.getElementById('edit-client-form').requestSubmit()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-bold flex items-center gap-2"><i class="ph ph-floppy-disk"></i> Salvar Tudo</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBr1vvN-c4QQ5S9KiHmRRF7Gq0SRzm6R_E",
            authDomain: "diagnostico-7dfde.firebaseapp.com",
            projectId: "diagnostico-7dfde",
            storageBucket: "diagnostico-7dfde.firebasestorage.app",
            messagingSenderId: "209032249418",
            appId: "1:209032249418:web:0e9c972c05779abf54a6b3",
            databaseURL: "https://diagnostico-7dfde-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Funções Globais Admin
        window.loadAdminData = function() {
            const leadsRef = ref(db, 'leads');
            const tableBody = document.getElementById('leads-table-body');
            const countEl = document.getElementById('total-leads-count');

            onValue(leadsRef, (snapshot) => {
                tableBody.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Nenhum lead encontrado.</td></tr>';
                    countEl.textContent = '0';
                    return;
                }

                const leads = Object.entries(data).map(([key, value]) => ({...value, id: key}));
                countEl.textContent = leads.length;
                leads.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                leads.forEach(lead => {
                    const date = new Date(lead.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute:'2-digit' });
                    let budgetBadgeClass = 'bg-gray-100 text-gray-600';
                    let budgetText = 'Iniciante';
                    if(lead.budget === 'medium') { budgetBadgeClass = 'bg-blue-100 text-blue-700'; budgetText = 'Crescimento'; }
                    if(lead.budget === 'high') { budgetBadgeClass = 'bg-purple-100 text-purple-700'; budgetText = 'Escala'; }

                    const hasDeliveries = lead.deliverables && Object.keys(lead.deliverables).length > 0;
                    const btnClass = hasDeliveries ? "bg-green-600 hover:bg-green-700" : "bg-gray-900 hover:bg-gray-700";
                    const btnText = hasDeliveries ? "Ver / Editar" : "Entregar";
                    const btnIcon = hasDeliveries ? "ph-check-circle" : "ph-paper-plane-right";

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition-colors border-b border-gray-100";
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-gray-500 text-xs">${date}</td>
                        <td class="px-6 py-4 font-bold text-indigo-700 text-xs">${lead.username || '-'}</td>
                        <td class="px-6 py-4"><button onclick="openClientDetails('${lead.id}')" class="font-medium text-gray-900 hover:text-indigo-600 hover:underline text-left">${lead.business_name}</button></td>
                        <td class="px-6 py-4 text-gray-600 text-xs">${lead.phone || '-'}<br>${lead.instagram || '-'}</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 rounded text-xs font-semibold ${budgetBadgeClass}">${budgetText}</span></td>
                        <td class="px-6 py-4 text-right"><button onclick="openClientDetails('${lead.id}')" class="${btnClass} text-white text-xs font-bold py-2 px-3 rounded flex items-center gap-1 ml-auto transition-colors"><i class="ph ${btnIcon}"></i> ${btnText}</button></td>
                    `;
                    tableBody.appendChild(tr);
                });
            });
        };

        window.openClientDetails = function(leadId) {
             const leadRef = ref(db, 'leads/' + leadId);
             onValue(leadRef, (snapshot) => {
                 const data = snapshot.val();
                 if(!data) return;

                 document.getElementById('edit-lead-id').value = leadId;
                 document.getElementById('edit-business-name').value = data.business_name || '';
                 document.getElementById('edit-niche').value = data.niche || '';
                 document.getElementById('edit-phone').value = data.phone || '';
                 document.getElementById('edit-instagram').value = data.instagram || '';
                 document.getElementById('edit-type').value = data.business_type || '';
                 document.getElementById('edit-budget').value = data.budget || '';
                 document.getElementById('edit-username').value = data.username || '';
                 document.getElementById('edit-password').value = data.password || '';

                 // Carregar Entregas
                 const container = document.getElementById('edit-deliverables-container');
                 container.innerHTML = '';
                 const sections = [{ id: 'landing', label: 'Página de Vendas' }, { id: 'design', label: 'Identidade Visual' }, { id: 'ads', label: 'Anúncios' }, { id: 'content', label: 'Feed & Conteúdo' }];
                 sections.forEach(sec => {
                     const delivery = (data.deliverables && data.deliverables[sec.id]) || { coverUrl: '', targetUrl: '' };
                     const div = document.createElement('div');
                     div.className = "bg-white p-4 rounded-lg border border-gray-200 shadow-sm";
                     div.innerHTML = `<p class="font-semibold text-sm text-gray-800 mb-2">${sec.label}</p><div class="space-y-2"><input type="text" placeholder="Link da Capa (Imagem)" value="${delivery.coverUrl || ''}" id="del-cover-${sec.id}" class="w-full p-2 border rounded text-xs"><input type="text" placeholder="Link do Arquivo (Drive/Dropbox)" value="${delivery.targetUrl || ''}" id="del-target-${sec.id}" class="w-full p-2 border rounded text-xs"></div>`;
                     container.appendChild(div);
                 });

                 // Carregar PLANO DE AÇÃO
                 const plan = data.action_plan || {};
                 document.getElementById('plan-pages').value = plan.pages || '';
                 document.getElementById('plan-ads').value = plan.ads || '';
                 document.getElementById('plan-content').value = plan.content || '';

                 // Carregar OBJETIVOS
                 const goals = data.objectives || {};
                 document.getElementById('obj-1').value = goals.obj1 || '';
                 document.getElementById('obj-2').value = goals.obj2 || '';
                 document.getElementById('obj-3').value = goals.obj3 || '';
                 document.getElementById('obj-4').value = goals.obj4 || '';

                 // Carregar MÉTRICAS
                 const metrics = data.metrics || {};
                 document.getElementById('met-whatsapp').value = metrics.whatsapp || '';
                 document.getElementById('met-sales').value = metrics.sales || '';
                 document.getElementById('met-gross').value = metrics.gross || '';
                 document.getElementById('met-profit').value = metrics.profit || '';

                 document.getElementById('client-details-modal').classList.remove('hidden-section');
             }, { onlyOnce: true });
        };

        window.saveClientDetails = function(e) {
            e.preventDefault();
            const leadId = document.getElementById('edit-lead-id').value;
            if(!leadId) return;
            const updates = {};
            
            // Dados e Login
            updates[`leads/${leadId}/business_name`] = document.getElementById('edit-business-name').value;
            updates[`leads/${leadId}/niche`] = document.getElementById('edit-niche').value;
            updates[`leads/${leadId}/phone`] = document.getElementById('edit-phone').value;
            updates[`leads/${leadId}/instagram`] = document.getElementById('edit-instagram').value;
            updates[`leads/${leadId}/business_type`] = document.getElementById('edit-type').value;
            updates[`leads/${leadId}/budget`] = document.getElementById('edit-budget').value;
            updates[`leads/${leadId}/username`] = document.getElementById('edit-username').value;
            updates[`leads/${leadId}/password`] = document.getElementById('edit-password').value;

            // Entregas
            const sections = ['landing', 'design', 'ads', 'content'];
            sections.forEach(sec => {
                const cover = document.getElementById(`del-cover-${sec}`).value;
                const target = document.getElementById(`del-target-${sec}`).value;
                if(cover || target) {
                    updates[`leads/${leadId}/deliverables/${sec}`] = { coverUrl: cover, targetUrl: target, updatedAt: new Date().toISOString() };
                }
            });

            // SALVAR PLANO DE AÇÃO
            updates[`leads/${leadId}/action_plan/pages`] = document.getElementById('plan-pages').value;
            updates[`leads/${leadId}/action_plan/ads`] = document.getElementById('plan-ads').value;
            updates[`leads/${leadId}/action_plan/content`] = document.getElementById('plan-content').value;

            // SALVAR OBJETIVOS
            updates[`leads/${leadId}/objectives/obj1`] = document.getElementById('obj-1').value;
            updates[`leads/${leadId}/objectives/obj2`] = document.getElementById('obj-2').value;
            updates[`leads/${leadId}/objectives/obj3`] = document.getElementById('obj-3').value;
            updates[`leads/${leadId}/objectives/obj4`] = document.getElementById('obj-4').value;

            // SALVAR MÉTRICAS
            updates[`leads/${leadId}/metrics/whatsapp`] = document.getElementById('met-whatsapp').value;
            updates[`leads/${leadId}/metrics/sales`] = document.getElementById('met-sales').value;
            updates[`leads/${leadId}/metrics/gross`] = document.getElementById('met-gross').value;
            updates[`leads/${leadId}/metrics/profit`] = document.getElementById('met-profit').value;

            update(ref(db), updates).then(() => {
                alert('Dados atualizados com sucesso!');
                document.getElementById('client-details-modal').classList.add('hidden-section');
            }).catch(err => alert('Erro: ' + err.message));
        };
    </script>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;
            if (password === 'admin123') {
                document.getElementById('admin-login-screen').classList.add('hidden-section');
                document.getElementById('admin-dashboard-screen').classList.remove('hidden-section');
                if(window.loadAdminData) window.loadAdminData();
            } else {
                alert('Senha incorreta!');
            }
        }

        function closeClientDetailsModal() {
            document.getElementById('client-details-modal').classList.add('hidden-section');
        }

        function logoutAdmin() {
            location.reload();
        }
    </script>
</body>
</html>
